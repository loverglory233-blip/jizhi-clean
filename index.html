<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>集智 JIZHI - 多智能体协作写作平台</title>
  <link rel="stylesheet" href="css/styles.css?v=20260823_v124">
  <script src="js/libs/xlsx.full.min.js"></script>
  <!-- Quill 1.3.7 学术富文本编辑器 (100% 本地离线化) -->
  <link href="css/libs/quill.snow.css" rel="stylesheet">
  <script src="js/libs/quill.min.js"></script>

  <style>
    #app-loading-screen {
      position: fixed;
      inset: 0;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      border-top-color: #6366f1;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="app-loading-screen">
    <div class="spinner"></div>
    <div style="font-size: 15px; font-weight: 600; color: #f8fafc; letter-spacing: 0.5px;">集智 JIZHI 平台加载中...</div>
    <div style="font-size: 12px; margin-top: 6px; color: #64748b;">多智能体协同写作与人机共存学习系统</div>
  </div>

  <div id="app"></div>

  <!-- 现代化原生模块直接调用模式 (纯模块化、零打包、修改 src/ 即时生效) -->
  <script type="module" src="src/app.js?v=20260823_v124"></script>

  <script>
    // Fail-safe dismiss if bundle initialized
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('app-loading-screen');
        if (loader && loader.style.display !== 'none') {
          loader.style.opacity = '0';
          setTimeout(() => { loader.style.display = 'none'; }, 200);
        }
      }, 100);
    });
  </script>
</body>
</html>
