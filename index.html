<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>集智 JIZHI - 面向团队协作的多智能体人机协同写作平台</title>
  <link rel="stylesheet" href="css/styles.css?v=20260905_v2605">
  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/diff@5.1.0/dist/diff.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* 极致轻量加载器 */
    #app-loading-screen {
      position: fixed; inset: 0; background: #0f172a;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 999999; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 3.5px solid rgba(255,255,255,0.15);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="app-loading-screen">
    <div class="spinner"></div>
    <div style="font-size: 17px; font-weight: 700; color: #f8fafc; letter-spacing: 0.5px;">集智 JIZHI</div>
    <div style="font-size: 13px; margin-top: 6px; color: #94a3b8; font-weight: 500;">面向团队协作的多智能体人机协同写作平台</div>
  </div>

  <div id="app"></div>

  <!-- 现代化原生模块直接调用模式 (纯模块化、零打包、修改 src/ 即时生效) -->
  <script type="module" src="src/app.js?v=20260905_v2605"></script>

  <script>
    // Fail-safe dismiss if bundle initialized
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('app-loading-screen');
        if (loader && loader.style.display !== 'none') {
          loader.style.opacity = '0';
          setTimeout(() => { loader.style.display = 'none'; }, 200);
        }
      }, 100);
    });
  </script>
</body>
</html>
